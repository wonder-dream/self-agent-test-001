services:
  wander:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: 8080
      CHROMIUM_NO_SANDBOX: "1"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - wander-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  wander-data:
